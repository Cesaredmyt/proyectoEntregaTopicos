<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cotizador de entregas</title>
    <style>
      :root {
        --fondo-1: #eef2ff;
        --fondo-2: #e0f2fe;
        --tarjeta: #ffffff;
        --texto: #0f172a;
        --suave: #64748b;
        --borde: #cbd5e1;
        --acento: #4f46e5;
        --acento-oscuro: #4338ca;
        --ok-fondo: #ecfdf5;
        --ok-borde: #6ee7b7;
        --ok-texto: #065f46;
        --error-fondo: #fef2f2;
        --error-borde: #fca5a5;
        --error-texto: #991b1b;
        --carga-fondo: #f1f5f9;
        --sombra: 0 20px 45px rgba(79, 70, 229, 0.15);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --fondo-1: #0f172a;
          --fondo-2: #1e1b4b;
          --tarjeta: #1e293b;
          --texto: #f1f5f9;
          --suave: #94a3b8;
          --borde: #334155;
          --acento: #818cf8;
          --acento-oscuro: #6366f1;
          --ok-fondo: #052e22;
          --ok-borde: #047857;
          --ok-texto: #a7f3d0;
          --error-fondo: #3b0d0d;
          --error-borde: #b91c1c;
          --error-texto: #fecaca;
          --carga-fondo: #0f172a;
          --sombra: 0 20px 45px rgba(0, 0, 0, 0.45);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--texto);
        background: linear-gradient(135deg, var(--fondo-1), var(--fondo-2));
      }

      .tarjeta {
        width: 100%;
        max-width: 28rem;
        padding: 2rem;
        background: var(--tarjeta);
        border-radius: 1.25rem;
        box-shadow: var(--sombra);
      }

      .encabezado {
        text-align: center;
        margin-bottom: 1.75rem;
      }

      .logo {
        display: inline-grid;
        place-items: center;
        width: 3.5rem;
        height: 3.5rem;
        font-size: 1.75rem;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--acento), #06b6d4);
        margin-bottom: 0.75rem;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      .subtitulo {
        margin: 0.35rem 0 0;
        color: var(--suave);
        font-size: 0.95rem;
      }

      .campos {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      @media (max-width: 26rem) {
        .campos {
          grid-template-columns: 1fr;
        }
      }

      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--suave);
      }

      input {
        display: block;
        width: 100%;
        margin-top: 0.4rem;
        padding: 0.75rem 0.9rem;
        font-size: 1rem;
        color: var(--texto);
        background: transparent;
        border: 1.5px solid var(--borde);
        border-radius: 0.75rem;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      input:focus {
        outline: none;
        border-color: var(--acento);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--acento) 25%, transparent);
      }

      button {
        width: 100%;
        margin-top: 1.5rem;
        padding: 0.85rem 1rem;
        font-size: 1rem;
        font-weight: 600;
        color: #ffffff;
        background: var(--acento);
        border: none;
        border-radius: 0.75rem;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.1s;
      }

      button:hover {
        background: var(--acento-oscuro);
      }
      button:active {
        transform: scale(0.98);
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .resultado {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-top: 1.5rem;
        padding: 1rem 1.25rem;
        border: 1.5px solid;
        border-radius: 1rem;
        animation: aparecer 0.25s ease-out;
      }

      .resultado[hidden] {
        display: none;
      }
      .resultado.ok {
        background: var(--ok-fondo);
        border-color: var(--ok-borde);
        color: var(--ok-texto);
      }
      .resultado.error {
        background: var(--error-fondo);
        border-color: var(--error-borde);
        color: var(--error-texto);
      }
      .resultado.cargando {
        background: var(--carga-fondo);
        border-color: var(--borde);
        color: var(--suave);
      }

      .icono {
        font-size: 2.5rem;
        line-height: 1;
      }
      .etiqueta {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        opacity: 0.8;
      }
      .titulo {
        margin: 0.1rem 0;
        font-size: 1.4rem;
        font-weight: 700;
        text-transform: capitalize;
      }
      .detalle {
        margin: 0;
        font-size: 0.95rem;
      }

      @keyframes aparecer {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="tarjeta">
      <header class="encabezado">
        <div class="logo">📦</div>
        <h1>Cotizador de entregas</h1>
        <p class="subtitulo">Escribe la distancia y el peso del paquete</p>
      </header>

      <form id="formulario">
        <div class="campos">
          <label
            >Distancia (km)
            <input id="km" type="number" step="any" placeholder="Ej. 12" />
          </label>
          <label
            >Peso (kg)
            <input id="kg" type="number" step="any" placeholder="Ej. 3" />
          </label>
        </div>
        <button id="boton" type="submit">Cotizar</button>
      </form>

      <div
        id="resultado"
        class="resultado"
        role="status"
        aria-live="polite"
        hidden
      >
        <div id="icono" class="icono"></div>
        <div>
          <p id="etiqueta" class="etiqueta"></p>
          <p id="titulo" class="titulo"></p>
          <p id="detalle" class="detalle"></p>
        </div>
      </div>
    </main>

    <script>
      const formulario = document.getElementById("formulario");
      const boton = document.getElementById("boton");
      const resultado = document.getElementById("resultado");
      const icono = document.getElementById("icono");
      const etiqueta = document.getElementById("etiqueta");
      const titulo = document.getElementById("titulo");
      const detalle = document.getElementById("detalle");

      // Solo decoración: el icono no decide nada, la regla vive en el backend.
      const ICONOS = {
        bicicleta: "🚲",
        moto: "🛵",
        camioneta: "🚚",
        dron: "🚁",
      };

      function mostrar(tipo, emoji, textoEtiqueta, textoTitulo, textoDetalle) {
        resultado.hidden = false;
        resultado.className = "resultado " + tipo;
        icono.textContent = emoji;
        etiqueta.textContent = textoEtiqueta;
        titulo.textContent = textoTitulo;
        detalle.textContent = textoDetalle;
      }

      formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();

        const params = new URLSearchParams({
          km: document.getElementById("km").value,
          kg: document.getElementById("kg").value,
        });

        boton.disabled = true;
        mostrar("cargando", "⏳", "Un momento", "Consultando...", "");

        try {
          const respuesta = await fetch(
            "/entregas/cotizar/?" + params.toString(),
          );
          const datos = await respuesta.json();

          if (respuesta.ok) {
            mostrar(
              "ok",
              ICONOS[datos.medio] || "📦",
              "Medio sugerido",
              datos.medio,
              "Motivo: " + datos.motivo,
            );
          } else {
            mostrar(
              "error",
              "⚠️",
              "No se pudo cotizar",
              "Revisa los datos",
              datos.error,
            );
          }
        } catch (error) {
          mostrar(
            "error",
            "🔌",
            "Sin conexión",
            "No se pudo conectar",
            "Revisa que el servidor esté corriendo.",
          );
        } finally {
          boton.disabled = false;
        }
      });
    </script>
  </body>
</html>
